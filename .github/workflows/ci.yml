name: CI

on:
  push:
  pull_request:

# Read only: the jobs run the repository's code and its dependencies'.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Pinned by commit: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System Integrity Protection
        run: csrutil status
      - name: Test
        run: swift test
      - name: Bundle
        run: make app
