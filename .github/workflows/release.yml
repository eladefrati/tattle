name: Release

# Builds the release zip and its checksum and uploads them to a draft release. A draft makes
# no tag: GitHub tags the commit the zip was built from when the draft is published. It is
# started by hand, with the release's version, since nothing in the repository names it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release's version, YYYY.MM.DD.N: the day it is released, within a day of today's in UTC, and N counting that day's releases"
        required: true
        type: string

# Read only, unless a job says otherwise.
permissions:
  contents: read

# bash -eo pipefail: a failed command anywhere in a pipeline fails its step.
defaults:
  run:
    shell: bash

# Two runs at once would build and draft the same version.
concurrency: release

jobs:
  # Checks the version given and refuses one already published or tagged, or one that skips a
  # number. It has no checkout and runs no code from the repository and no third-party action:
  # gh alone.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # Typed by whoever started the run, so read from here, never written into the script.
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Not printed before its shape is checked: a line in it could read as a workflow command.
          [[ "$RELEASE_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]] \
            || { echo "::error::the version input is not of the form YYYY.MM.DD.N"; exit 1; }
          # Its date must be yesterday, today or tomorrow in UTC, so a typo cannot name the
          # release for another day; today's date in UTC is already the next day's in an evening
          # west of UTC. All three come from one reading of the clock.
          day=${RELEASE_VERSION%.*}
          now=$(date -u +%s)
          yesterday=$(date -u -d "@$((now - 86400))" +%Y.%m.%d)
          today=$(date -u -d "@$now" +%Y.%m.%d)
          tomorrow=$(date -u -d "@$((now + 86400))" +%Y.%m.%d)
          [[ "$day" == "$yesterday" || "$day" == "$today" || "$day" == "$tomorrow" ]] \
            || { echo "::error::the date $day is not $yesterday, $today or $tomorrow, the dates within a day of today's in UTC"; exit 1; }
          # A published release, or a tag, already holds this version. Either list failing to
          # read fails the step. Drafts are not counted, and this token cannot see them: a build
          # is redone under the same version until its release is published.
          releases=$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')
          tags=$(gh api "repos/$REPOSITORY/tags" --paginate --jq '.[].name')
          # Not a pipe: under pipefail, grep -q leaving early could fail the writer and read as no match.
          if grep -qxF "v$RELEASE_VERSION" <<<"$releases"$'\n'"$tags"; then
            echo "::error::v$RELEASE_VERSION is published or tagged already; start a run with the next version"
            exit 1
          fi
          # N counts the day's releases, so it is one past the highest N among that day's
          # published releases and tags: a typo cannot skip a number. A draft's number is taken
          # only once it is published.
          last=$(printf '%s\n%s\n' "$releases" "$tags" | awk -v p="v$day." 'index($0, p) == 1 { n = substr($0, length(p) + 1)
              if (n ~ /^[0-9]+$/ && n + 0 > max) max = n + 0 } END { print max + 0 }')
          [[ "${RELEASE_VERSION##*.}" == "$((last + 1))" ]] \
            || { echo "::error::v$RELEASE_VERSION is not the next number: the next release of $day is v$day.$((last + 1))"; exit 1; }
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The version goes into the app's Info.plist and the files' names: its shape is checked
      # before anything uses it.
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]] \
            || { echo "::error::not a version of the form YYYY.MM.DD.N: $VERSION"; exit 1; }

      # The build runs the dependencies' code, so the checkout keeps no credentials. Pinned by
      # commit, as every action here: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: make release VERSION="$VERSION"

      # Anyone signed in to GitHub can download a public repository's run artifacts, so the
      # untested zip is kept one day, enough for the draft job, not the default 90.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/dist/Tattle-${{ env.VERSION }}.zip
            build/dist/Tattle-${{ env.VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  # Can write, to see the drafts, which no lesser token does, and to make one. It runs nothing
  # from the repository: it checks the zip against its checksum and uploads both to a draft release.
  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Pinned by commit: whatever a moved tag pointed to would run with this job's write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Check the checksum
        working-directory: dist
        run: sha256sum --check --strict "Tattle-$VERSION.zip.sha256"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A published release of this version is refused: the version job refuses one too, but
          # one may have been published since. Every draft of it, made by hand or by an earlier
          # run, is replaced: the new draft is made first, then the earlier ones are deleted, so a
          # failed upload leaves them as they were. Any call failing fails the step.
          # Releases are listed as "<tag> <draft> <id>"; a tag holds no space.
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | "\(.tag_name) \(.draft) \(.id)"')
          matches=$(awk -v tag="v$VERSION" '$1 == tag' <<<"$releases")
          if awk '$2 == "false" { found = 1 } END { exit !found }' <<<"$matches"; then
            echo "::error::a published release named v$VERSION exists already; start a run with the next version"
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Tattle $VERSION" --notes "" "dist/Tattle-$VERSION.zip" "dist/Tattle-$VERSION.zip.sha256"
          for id in $(awk '{ print $3 }' <<<"$matches"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "Deleted the earlier draft v$VERSION ($id)"
          done
          {
            echo "Draft v$VERSION from $GITHUB_SHA"
            echo
            echo '```'
            cat "dist/Tattle-$VERSION.zip.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
